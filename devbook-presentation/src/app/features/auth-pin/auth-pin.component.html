<h1>Entrez le code PIN reçu par le mail</h1>
<div class="input-form">
    <form [formGroup]="pinForm" (ngSubmit)="onSubmit()">
        <div class="pinInputs">
            <input type="text" formControlName="pin1">
            <input type="text" formControlName="pin2">
            <input type="text" formControlName="pin3">
            <input type="text" formControlName="pin4">
        </div>
        <div class="button">
            <button>Envoyer</button>
        </div>
    </form>
</div>
