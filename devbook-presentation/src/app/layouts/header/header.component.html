<div class="iconContainer">
    <a routerLink="/rss-providers">
        <span class="material-symbols-outlined">
            rss_feed
        </span>
    </a>
    <a routerLink="/profile">
        <app-profile-link></app-profile-link>
    </a>

    <button class="noStyle" (click)="toggleShareArticle()">
    <span class="material-symbols-outlined">
      add_box
    </span>
    </button>

    <app-notification *ngIf="showNotification"></app-notification>

</div>


<div *ngIf="displayedShareArticle" class="shareArticleContainer">
    <app-share-article></app-share-article>
</div>
